<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unipäiväkirja</title>
  <meta name="description" content="Unipäiväkirja: aamu- ja iltakysely, kahvit, teet ja Neurosonic">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#141a2e">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Asennustapahtuma talteen heti, ettei se laukea ennen moduuliskriptin latautumista
    window.__installPrompt = null;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      window.__installPrompt = e;
      document.dispatchEvent(new Event('installprompt-ready'));
    });
    window.addEventListener('appinstalled', () => {
      window.__installPrompt = null;
      document.dispatchEvent(new Event('installprompt-ready'));
    });
  </script>
</head>
<body>
  <header class="topbar">
    <span class="logo" aria-hidden="true">🌙</span>
    <span class="app-name">Unipäiväkirja</span>
    <span id="syncStatus" class="sync"></span>
  </header>

  <main id="main"><p class="loading">Ladataan…</p></main>

  <section id="login" class="login" hidden>
    <div class="card">
      <div class="big-logo">🌙</div>
      <h1>Unipäiväkirja</h1>
      <p>Aamulla tiedot yöstä, illalla päivän kulku. Kirjaudu Google-tilillä, niin tiedot tallentuvat pilveen ja näkyvät vain sinulle.</p>
      <button id="loginBtn" class="btn primary wide big">Kirjaudu Google-tilillä</button>
      <button id="loginInstall" class="btn wide" style="margin-top:10px" hidden>📲 Asenna sovellus</button>
      <p id="loginError" class="error"></p>
    </div>
  </section>

  <nav class="tabbar" id="tabbar" hidden>
    <button data-view="today"><span class="ico">🏠</span><span>Tänään</span></button>
    <button data-view="history"><span class="ico">📅</span><span>Historia</span></button>
    <button data-view="reports"><span class="ico">📈</span><span>Raportit</span></button>
    <button data-view="settings"><span class="ico">⚙️</span><span>Asetukset</span></button>
  </nav>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(e => console.warn('SW', e));
      });
    }
  </script>
</body>
</html>
